services:
  - type: web
    name: facilityflow-backend
    runtime: node
    # "starter" = always-on instance (free tier spins down and has cold starts).
    plan: starter
    # Must match the database region — internal hostnames only resolve
    # within the same region (P1001 otherwise).
    region: virginia
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: facilityflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Short-lived access token; sessions renew via POST /auth/refresh.
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: CORS_ORIGIN
        value: https://facilityflow-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://facilityflow-frontend.onrender.com
      # Ephemeral disk on Render — all uploads MUST go to S3-compatible
      # storage or they are wiped on every deploy. Set these in the dashboard.
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Shared rate-limit store (set when running more than one instance).
      - key: REDIS_URL
        sync: false
      # Real email delivery for password resets and worker invites.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  - type: web
    name: facilityflow-frontend
    runtime: node
    plan: starter
    region: virginia
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://facilityflow-backend.onrender.com/api/v1

databases:
  - name: facilityflow-db
    # Paid tier: does NOT expire (the free Postgres plan expires after 30 days).
    plan: basic-256mb
    databaseName: facilityflow
    user: facilityflow
    postgresMajorVersion: "16"