services:
  - type: web
    name: facilityflow-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: facilityflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        value: https://facilityflow-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://facilityflow-frontend.onrender.com
      - key: UPLOAD_ROOT
        value: ./uploads
      - key: EMAIL_PROVIDER
        value: console
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  - type: web
    name: facilityflow-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://facilityflow-backend.onrender.com/api/v1

databases:
  - name: facilityflow-db
    plan: free
    databaseName: facilityflow
    user: facilityflow
